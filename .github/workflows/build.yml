name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build -c release

      - name: Bundle
        run: make bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneDisplay.app
          path: OneDisplay.app
